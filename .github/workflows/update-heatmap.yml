name: 한국 주식 히트맵 업데이트 및 배포

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # UTC -> KST: weekdays 10:30, 16:15, 18:15
    - cron: '30 1 * * 1-5'
    - cron: '15 7,9 * * 1-5'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: korean-stock-heatmap-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect KOSPI and KOSDAQ from Naver Finance
        run: python3 scripts/update.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
