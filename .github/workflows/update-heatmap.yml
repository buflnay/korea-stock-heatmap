name: 한국 주식 히트맵 업데이트 및 배포

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 한국 시간 평일 09:00~14:30, 30분 간격
    - cron: '0,30 0-5 * * 1-5'

    # 한국 시간 평일 15:00
    - cron: '0 6 * * 1-5'

    # 장 마감 후 16:15
    - cron: '15 7 * * 1-5'

    # 야간 최종 업데이트 20:00
    - cron: '0 11 * * 1-5'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: korean-stock-heatmap-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect KOSPI and KOSDAQ from Naver Finance
        working-directory: korea-stock-heatmap-kospi-kosdaq
        run: python3 scripts/update.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: korea-stock-heatmap-kospi-kosdaq
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
